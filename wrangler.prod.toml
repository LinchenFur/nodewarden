# Production deployment for the live password manager (warden.cubland.space).
# Targets the existing "furnodewarden" Worker and its live D1/R2 resources.
# JWT_SECRET is an existing Worker secret and is preserved across deploys.
name = "furnodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "warden.cubland.space", custom_domain = true, zone_name = "cubland.space" },
]

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"
database_id = "68f1f634-cd1a-4a32-968b-3899252acbd9"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
